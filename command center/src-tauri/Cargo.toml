[package]
name = "command-center"
version = "0.1.0"
description = "Agentic OS Command Center (Jarvis)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
url = "2"
tauri-plugin-notification = "2"
base64 = "0.22"
regex = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Native audio engine (src/audio). cpal "realtime" promotes its WASAPI I/O threads to MMCSS
# real-time priority (falls back to THREAD_PRIORITY_TIME_CRITICAL).
cpal = { version = "0.18", features = ["realtime"] }
crossbeam-queue = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# MCP stdio servers run inside a kill-on-close Job Object so stopping one (or the app
# crashing) also ends its node / python grandchildren (src/proc.rs `Job`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
